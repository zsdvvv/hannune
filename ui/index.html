<!doctype html>
<html lang="ko" data-theme="paper">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>한눈에</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="circle.css">
</head>
<body>
<div class="frame" id="frame">
<header class="bar">
  <div class="brand"><span class="mark">한눈에</span><span class="today" id="today"></span><span class="clock num" id="clock"></span></div>
  <nav class="views" id="views">
    <button data-view="list" title="1">목록</button><button data-view="matrix" title="2">4분면</button><button data-view="timeline" title="3">달력 띠</button>
  </nav>
  <div class="tools">
    <span class="rec" id="rec" hidden title="창 사용 기록이 켜져 있습니다. 누르면 설정을 엽니다.">● 창 기록 중</span>
    <input id="q" placeholder="찾기   /" autocomplete="off">
    <button class="btn" id="btnAdd" title="할 일 넣기 (N)">＋ 할 일</button>
    <button class="btn" id="btnAI" title="AI로 영역·주제·마감·다음 할 일 정리">AI 정리</button>
    <button class="btn" id="btnScan" title="다시 읽기 (R)">다시 읽기</button>
    <button class="btn" id="btnPin" title="이 창을 늘 맨 위에">고정</button>
    <button class="btn" id="btnMini" title="작은 창을 화면 구석에 띄움 (Ctrl+Alt+M)">미니</button>
    <button class="btn" id="btnHamkke" hidden title="서클 사람과 함께 고치는 글(함께고침)을 봅니다. 문서·비서를 바탕으로 초안을 만들어 놓고 한 줄씩 함께 고칩니다">함께고침</button>
    <button class="btn" id="btnCircle" hidden title="오른쪽 서클 칸을 내보내고 넣습니다">서클</button>
    <button class="btn" id="btnSet" title="설정">설정</button>
  </div>
</header>
<div class="body" id="body">
  <aside class="side" id="side"></aside>
  <div class="split" id="splitL" title="끌어서 너비 조절 · 두 번 누르면 접기/펴기"></div>
  <main id="main"></main>
  <div class="split" id="splitR" title="끌어서 너비 조절"></div>
  <section class="detail" id="detail" hidden></section>
  <div class="split" id="splitC" hidden title="끌어서 서클 칸 너비를 조절합니다"></div>
  <aside class="circle" id="circle" hidden></aside>
  <button class="circle-rail" id="circleRail" hidden title="커서를 대면 서클 칸이 미끄러져 나옵니다. MD를 끌어 와도 나옵니다">서클</button>
</div>
<form class="quick" id="quick" autocomplete="off">
  <span class="ql">바로 넣기</span>
  <button type="button" class="mic" id="qMic" title="말로 넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="cap" x="9" y="2.6" width="6" height="11.4" rx="3"/><path d="M5.2 11.2a6.8 6.8 0 0 0 13.6 0"/><path d="M12 18v3.2M8.8 21.2h6.4"/></svg><span class="ring"></span></button>
  <canvas class="qwave" id="qWave" width="240" height="44" hidden></canvas>
  <button type="button" class="abtn" id="qAgent" title="비서와 말하기 — 일정을 물어보거나 말로 넣고 바꾸고 설정도 고칩니다 (Alt+B · 어디서나 Ctrl+Alt+B)">비서</button>
  <input id="quickIn" placeholder="예: 내일 오후 3시까지 보고서 제출 ★★★ #업무   ·   금요일 회의 준비   ·   11/5 장학금 신청 중요">
  <span class="qp" id="quickPrev"></span>
  <button class="btn on">넣기</button>
</form>
<footer class="status" id="status"></footer>
</div>
<div class="agent" id="agentPanel" hidden></div>
<div class="brief" id="brief" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="modal" id="modal2" hidden></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="common.js"></script>
<script src="nlp.js"></script>
<script src="tips.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="linkcore.js"></script>
<script src="voicecore.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
<script src="circle.js"></script>
</body>
</html>
