# 버전 태그(v1.2.1 같은)를 올리면 윈도우·맥 설치본을 만들어 Releases에 올린다.
# 순서: ① 초안 릴리스 → ② 윈도우·맥(애플 칩)·맥(인텔)에서 각각 앱을 만들고 "실제로 켜 보는 실행 시험"을 통과한 것만
#       초안에 올림 → ③ 셋 다 통과하면 공개. 하나라도 실패하면 공개하지 않는다(초안으로 남음).
name: 설치본 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 초안 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --draft --title "한눈에 일정판 ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dir: npx electron-builder --win dir --x64 --publish never
            dist: npx electron-builder --win nsis --x64 --publish always
          - os: macos-latest
            dir: npx electron-builder --mac dir --arm64 --publish never
            dist: npx electron-builder --mac dmg --arm64 --publish always
          - os: macos-15-intel
            dir: npx electron-builder --mac dir --x64 --publish never
            dist: npx electron-builder --mac dmg --x64 --publish always
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 앱 만들기
        run: ${{ matrix.dir }}
      - name: 실행 시험 (실제로 켜서 화면이 그려지는지)
        run: node build/smoke.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out/
      - name: 설치본 만들어 초안에 올리기
        run: ${{ matrix.dist }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 공개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
