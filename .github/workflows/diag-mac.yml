# 맥 진단(임시): 여러 판을 나란히 켜 보고 어느 것이 사는지 본다.
name: 맥 진단

on:
  workflow_dispatch:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [current, ascii-name, no-adhoc, dev-electron, electron-hello]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 만들기
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "${{ matrix.variant }}" in
            current)    npx electron-builder --mac dir --arm64 --publish never ;;
            ascii-name) npx electron-builder --mac dir --arm64 --publish never -c.productName=Hannune -c.executableName=Hannune ;;
            no-adhoc)   npx electron-builder --mac dir --arm64 --publish never -c.afterPack=null ;;
            *) echo "만들기 없음" ;;
          esac
      - name: 켜 보기
        run: |
          case "${{ matrix.variant }}" in
            dev-electron)
              SMOKE_EXE=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron SMOKE_APPDIR=. node build/smoke.js ;;
            electron-hello)
              mkdir -p /tmp/hello
              echo '{"name":"hello","main":"main.js"}' > /tmp/hello/package.json
              echo 'const {app,BrowserWindow}=require("electron");app.whenReady().then(()=>{const w=new BrowserWindow({width:300,height:200});w.loadURL("data:text/html,hello");setTimeout(()=>{console.log("HELLO OK");app.exit(0)},3000)})' > /tmp/hello/main.js
              SMOKE_HELLO=1 SMOKE_EXE=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron SMOKE_APPDIR=/tmp/hello node build/smoke.js ;;
            *) node build/smoke.js ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.variant }}
          path: smoke-out/
